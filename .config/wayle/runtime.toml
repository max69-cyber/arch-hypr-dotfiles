[general]
font-mono = "Adwaita Mono"

[bar]
scale = 0.8500000238418579
inset-edge = 0.25
inset-ends = 0.6000000238418579
padding = 0.4000000059604645
padding-ends = 1.0
module-gap = 0.550000011920929
background-opacity = 90
rounding = "md"
shadow = "floating"
button-variant = "basic"

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
    "window-title",
    "systray",
]
center = ["cava"]
right = [
    "brightness",
    "keyboard-input",
    "bluetooth",
    "network",
    "volume",
    "clock",
    "notifications",
]

[styling]
scale = 1.1100000143051147

[styling.palette]
bg = "#282828"
surface = "#3c3836"
elevated = "#504945"
fg = "#ebdbb2"
fg-muted = "#d5c4a1"
primary = "#83a598"
red = "#fb4934"
yellow = "#fabd2f"
green = "#b8bb26"
blue = "#8ec07c"

[modules.brightness]
label-show = false

[modules.cava]
stereo = true

[modules.clock]
icon-show = false
dropdown-show-seconds = true

[modules.hyprland-workspaces]
app-icons-show = true

[modules.keyboard-input]
icon-show = false

[modules.network]
label-show = false

[modules.notifications]
label-show = false

[modules.window-title]
label-max-length = 25

[osd]
position = "top"

[wallpaper]
transition-type = "none"
