general {
    disable_loading_bar = false
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

# Both monitors: the actual desktop wallpaper file, dimmed/blurred.
# (Static file load, not a live screenshot — avoids the cross-GPU
# wlr-screencopy bug that showed black on the secondary monitor.)
background {
    monitor =
    path = /home/rayxaus/Pictures/Wallpapers/test_wallpaper.jpg
    blur_passes = 1
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.35
    vibrancy = 0.1696
    vibrancy_darkness = 0.2
}

# Clock + password only on the main monitor (HDMI-A-1)
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(197, 210, 224, 1.0)
    font_size = 140
    font_family = Adwaita Sans Black
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(143, 162, 184, 1.0)
    font_size = 22
    font_family = Adwaita Sans Black
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor = HDMI-A-1
    size = 200, 42
    rounding = 21
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(28, 44, 72, 1.0)
    inner_color = rgba(9, 12, 19, 0.75)
    font_color = rgba(197, 210, 224, 1.0)
    check_color = rgba(8, 145, 178, 1.0)
    fail_color = rgba(220, 38, 38, 1.0)
    placeholder_text = <span foreground="##8fa2b8">Password</span>
    position = 0, 70
    halign = center
    valign = bottom
    fade_on_empty = false
}
